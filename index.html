<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九周年快乐 ❤️</title>
<style>
    body {
        margin: 0;
        background: #ffdde1;
        overflow: hidden;
        font-family: "微软雅黑", sans-serif;
        text-align: center;
    }

    #heart {
        font-size: 80px;
        cursor: pointer;
        animation: beat 1.2s infinite;
        margin-top: 40vh;
    }

    @keyframes beat {
        0% { transform: scale(1); }
        30% { transform: scale(1.3); }
        60% { transform: scale(1); }
    }

    #text-box {
        position: absolute;
        width: 100%;
        top: 10vh;
        font-size: 28px;
        color: #d00000;
    }
</style>
</head>

<body>

<div id="text-box">❤️ 亲爱的宝贝，点一下爱心吧 ❤️</div>
<div id="heart">❤️</div>

<!-- 音乐 -->
<audio id="bgm" src="https://cdn.pixabay.com/audio/2024/01/08/audio_65e6872dac.mp3" loop></audio>

<script>
// 你想显示的句子（自己可以改）
const messages = [
    "宝贝，今天是我们的第九周年 ❤️",
    "九年很长，但和你在一起的每一天都很短。",
    "谢谢你陪我走过这么长的时间。",
    "未来我也想继续和你一起，走更远的路。",
    "愿我们每天都像第一次牵手那样心动。",
    "我爱你 ❤️ forever."
];

let index = 0;

document.getElementById("heart").addEventListener("click", () => {

    // 自动播放音乐（手机限制：需要第一次点击触发）
    const bgm = document.getElementById("bgm");
    bgm.play().catch(() => {}); 

    // 显示下一句
    document.getElementById("text-box").innerText = messages[index];

    index++;
    if (index >= messages.length) index = messages.length - 1;

    // 点击爱心时爆出小心心
    createHeartExplosion();
});

// 小爱心爆炸动画
function createHeartExplosion() {
    for (let i = 0; i < 20; i++) {
        const heart = document.createElement("div");
        heart.innerHTML = "❤️";
        heart.style.position = "fixed";
        heart.style.left = (window.innerWidth / 2) + "px";
        heart.style.top = (window.innerHeight / 2) + "px";
        heart.style.fontSize = "18px";
        heart.style.opacity = 1;
        document.body.appendChild(heart);

        const angle = Math.random() * 2 * Math.PI;
        const distance = 80 + Math.random() * 40;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        heart.animate([
            { transform: "translate(0, 0)", opacity: 1 },
            { transform: `translate(${x}px, ${y}px)`, opacity: 0 }
        ], {
            duration: 1500,
            easing: "ease-out"
        });

        setTimeout(() => heart.remove(), 1500);
    }
}
</script>

</body>
</html>
